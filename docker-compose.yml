services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-LuxuryMachuPicchu_Root_2026!}
      MYSQL_DATABASE: ${DB_NAME:-luxury_machupicchu_db}
      MYSQL_USER: ${DB_USER:-lmp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lmp_secure_pass_2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${DB_NAME:-luxury_machupicchu_db};User=${DB_USER:-lmp_user};Password=${DB_PASSWORD:-lmp_secure_pass_2026!};CharSet=utf8mb4;
      - AgencySettings__WhatsAppNumber=${WHATSAPP_NUMBER:-51958195840}
      - AgencySettings__Email=${AGENCY_EMAIL:-info@lmptravel.com}
      - AdminSettings__Username=${ADMIN_USERNAME:-concierge@luxurymachupicchu.com}
      - AdminSettings__Password=${ADMIN_PASSWORD:-MachuPicchuLuxury2026!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-LuxuryMachupicchuPeru_BelmondInspired_UltraSecureJwtKey_2026_Min32Chars!}
    expose:
      - 5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 80
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
