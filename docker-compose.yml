services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}
      MYSQL_DATABASE: ${DB_NAME:-luxury_machupicchu_db}
      MYSQL_USER: ${SERVICE_USER_MYSQL}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${DB_NAME:-luxury_machupicchu_db};User=${SERVICE_USER_MYSQL};Password=${SERVICE_PASSWORD_MYSQL};CharSet=utf8mb4;
      - AgencySettings__WhatsAppNumber=${WHATSAPP_NUMBER:-51958195840}
      - AgencySettings__Email=${AGENCY_EMAIL:-info@lmptravel.com}
      - AdminSettings__Username=${ADMIN_USERNAME:-concierge@luxurymachupicchu.com}
      - AdminSettings__Password=${SERVICE_PASSWORD_ADMIN:-MachuPicchuLuxury2026!}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT:-LuxuryMachupicchuPeru_BelmondInspired_UltraSecureJwtKey_2026_Min32Chars!}
    expose:
      - 5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 80
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
